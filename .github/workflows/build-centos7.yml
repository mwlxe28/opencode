name: Build OpenCode for CentOS7

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 (fixed repo + deps)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e

            # 1. 先删掉所有旧 repo，避免干扰
            rm -f /etc/yum.repos.d/*.repo

            # 2. 写入可用的阿里云 CentOS 7.9 源（关键）
            cat > /etc/yum.repos.d/CentOS-Base.repo <<"EOF"
            [base]
            name=CentOS-7.9.2009 - Base
            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/os/x86_64/
            gpgcheck=0
            enabled=1

            [updates]
            name=CentOS-7.9.2009 - Updates
            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/x86_64/
            gpgcheck=0
            enabled=1

            [extras]
            name=CentOS-7.9.2009 - Extras
            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/extras/x86_64/
            gpgcheck=0
            enabled=1
            EOF

            # 3. 重建缓存、装依赖
            yum clean all
            yum makecache
            yum install -y curl unzip

            # 4. 装 bun（固定版本，避免不稳定）
            curl -L https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o bun.zip
            unzip -o bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/bun
            chmod +x /usr/local/bin/bun

            # 5. 清缓存、重装依赖（解决 @octokit/rest 找不到）
            cd /workspace
            rm -rf node_modules bun.lockb
            bun install
            bun add @octokit/rest @octokit/core

            # 6. 编译
            bun build ./packages/opencode/src/cli.ts --compile --target=linux-x64 --outfile app

            # 确认产物
            ls -lh
          '

      - name: Check workspace
        run: |
          ls -lh
          pwd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-centos7
          path: app
          if-no-files-found: error
