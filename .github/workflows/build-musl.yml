name: Build Linux musl static only

on:
  workflow_dispatch:

# 关键：同分支只留最新一个，旧的自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install dependencies
        run: apk add --no-cache git curl bash gcc g++ musl-dev make

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun (linux-x64-musl)
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- --platform linux-x64-musl
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install deps
        run: bun install

      - name: Build static musl
        run: |
          BUN_LINK_TYPE=static \
          CC=musl-gcc \
          bun run packages/opencode/script/build.ts

      - name: List dist
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-musl-static
          path: dist/
