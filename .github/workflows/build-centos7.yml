name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 container with compatibility focus
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e
            
            echo "=== Fixing CentOS7 YUM repo ==="
            sed -i "s|mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            
            echo "=== Installing build dependencies with glibc 2.17 compatibility ==="
            yum install -y git curl tar gzip zip unzip gcc gcc-c++ make
            
            echo "=== Installing Python 3.9 for node-gyp compatibility ==="
            yum install -y centos-release-scl
            yum install -y rh-python39-python rh-python39-python-devel
            
            echo "Activating Python 3.9..."
            source /opt/rh/rh-python39/enable
            python3 --version
            
            echo "=== Installing static libraries ==="
            yum install -y glibc-static libstdc++-static zlib-static
            
            echo "=== Downloading Bun baseline (CentOS7 compatible) ==="
            curl -L https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o bun.zip
            unzip -q bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/bun
            chmod +x /usr/local/bin/bun
            echo "Bun version:"
            /usr/local/bin/bun --version
            
            echo "=== Building with prebuilt modules ==="
            /usr/local/bin/bun install --no-optional || /usr/local/bin/bun install
            
            echo "=== Building statically for CentOS7 ==="
            /usr/local/bin/bun build ./packages/opencode/src/cli.ts \
              --compile \
              --minify \
              --target=linux-x64 \
              --outfile opencode-centos7-static
            
            echo "=== Binary Information ==="
            file opencode-centos7-static
            ls -lh opencode-centos7-static
            
            echo "=== Checking for runtime dependencies ==="
            ldd opencode-centos7-static 2>&1 | head -20 || echo "Binary linking check complete"
          '

      - name: Verify binary compatibility  
        run: |
          echo "=== File Type ==="
          file opencode-centos7-static
          
          echo "=== Size ==="
          ls -lh opencode-centos7-static
          
          echo "=== Dependencies](#)
