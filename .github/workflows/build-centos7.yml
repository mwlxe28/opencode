name: Build OpenCode CentOS7
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun & build
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
          bun add @octokit/rest
          bun build ./packages/opencode/src/cli.ts --compile --target=linux-x64 --outfile opencode-centos7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-centos7
          path: opencode-centos7
