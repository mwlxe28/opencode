name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 container (FULL FIX)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e -x

            echo "====================================="
            echo " Fix all CentOS 7 YUM repos (Aliyun)"
            echo "====================================="
            cat > /etc/yum.repos.d/CentOS-Base.repo <<EOF
            [base]
            name=CentOS-7 - Base
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/os/x86_64/
            gpgcheck=0
            enabled=1
            [updates]
            name=CentOS-7 - Updates
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/updates/x86_64/
            gpgcheck=0
            enabled=1
            [extras]
            name=CentOS-7 - Extras
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/extras/x86_64/
            gpgcheck=0
            enabled=1
            EOF

            yum clean all
            yum makecache fast

            echo "====================================="
            echo " Install build tools"
            echo "====================================="
            yum install -y git curl tar gzip zip unzip gcc gcc-c++ make glibc-static libstdc++-static zlib-static

            echo "====================================="
            echo " Install Python 3.9 (SCL)"
            echo "====================================="
            yum install -y centos-release-scl
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-SCLo-*.repo
            sed -i 's|http://mirror.centos.org|https://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-SCLo-*.repo
            yum clean all
            yum makecache fast
            yum install -y rh-python39
            source /opt/rh/rh-python39/enable
            python3 --version

            echo "====================================="
            echo " Install Bun"
            echo "====================================="
            curl -L https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o bun.zip
            unzip -o bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/
            chmod +x /usr/local/bin/bun
            bun --version

            echo "====================================="
            echo " Install deps"
            echo "====================================="
            bun install --frozen-lockfile || bun install

            echo "====================================="
            echo " BUILD FINAL BINARY"
            echo "====================================="
            OUTPUT="opencode-centos7-static"
            bun build ./packages/opencode/src/cli.ts \
              --compile \
              --minify \
              --target=linux-x64 \
              --outfile "$OUTPUT"

            # 校验文件必须存在
            ls -lh "$OUTPUT"
            file "$OUTPUT"
          '

      - name: Show built binary
        run: |
          ls -lh opencode-centos7-static
          file opencode-centos7-static
