name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 container with full repo fix
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e

            echo "=== Fixing CentOS7 YUM repo (VAULT) ==="
            sed -i "s|mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|enabled=1|enabled=1|g" /etc/yum.repos.d/CentOS-Base.repo

            yum clean all
            yum makecache

            echo "=== Install build dependencies ==="
            yum install -y git curl tar gzip zip unzip gcc gcc-c++ make

            echo "=== Install SCL repo + FIX SCL REPO ==="
            yum install -y centos-release-scl centos-release-scl-rh

            # 关键：修复 SCL 仓库
            sed -i "s|mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/CentOS-SCLo-scl*.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-SCLo-scl*.repo

            yum clean all
            yum makecache

            echo "=== Install Python 3.9 ==="
            yum install -y rh-python39 rh-python39-python-devel

            echo "=== Activate Python 3.9 ==="
            source /opt/rh/rh-python39/enable
            python3 --version
            pip3 --version

            echo "=== Install static libs for static build ==="
            yum install -y glibc-static libstdc++-static zlib-static

            echo "=== Download Bun baseline ==="
            curl -L https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o bun.zip
            unzip -q bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/bun
            chmod +x /usr/local/bin/bun
            bun --version

            echo "=== Install dependencies ==="
            bun install --no-optional || bun install

            echo "=== Build static binary for CentOS7 ==="
            bun build ./packages/opencode/src/cli.ts \
              --compile \
              --minify \
              --target=linux-x64 \
              --outfile opencode-centos7-static

            echo "=== Binary info ==="
            file opencode-centos7-static
            ls -lh opencode-centos7-static

            echo "=== Check dependencies (static build) ==="
            ldd opencode-centos7-static 2>/dev/null || true
          '

      - name: Verify final binary
        run: |
          echo "--- Binary Type ---"
          file opencode-centos7-static
          echo "--- Size ---"
          ls -lh opencode-centos7-static
