name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e
            cd /workspace

            # 1. 替换 yum 源
            cat > /etc/yum.repos.d/CentOS-Base.repo <<"EOF"
            [base]
            name=CentOS-7 - Base
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/os/x86_64/
            gpgcheck=0
            enabled=1
            [updates]
            name=CentOS-7 - Updates
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/updates/x86_64/
            gpgcheck=0
            enabled=1
            [extras]
            name=CentOS-7 - Extras
            baseurl=https://mirrors.aliyun.com/centos/7.9.2009/extras/x86_64/
            gpgcheck=0
            enabled=1
            EOF

            yum clean all
            yum makecache fast

            # 2. 安装基础工具
            yum install -y git curl tar unzip gcc gcc-c++ make glibc-static libstdc++-static zlib-static

            # 3. 安装 SCL 源
            yum install -y centos-release-scl centos-release-scl-rh

            # 4. 替换 SCL 源（阿里云，无 sed！）
            cat > /etc/yum.repos.d/CentOS-SCLo-scl.repo <<"EOF"
            [centos-sclo-sclo]
            name=CentOS-7 - SCLo sclo
            baseurl=https://mirrors.aliyun.com/centos/7/sclo/x86_64/sclo/
            gpgcheck=0
            enabled=1
            EOF

            cat > /etc/yum.repos.d/CentOS-SCLo-scl-rh.repo <<"EOF"
            [centos-sclo-rh]
            name=CentOS-7 - SCLo rh
            baseurl=https://mirrors.aliyun.com/centos/7/sclo/x86_64/rh/
            gpgcheck=0
            enabled=1
            EOF

            yum clean all
            yum makecache fast

            # 5. 安装 Python3.9
            yum install -y rh-python39
            source /opt/rh/rh-python39/enable
            python3 --version

            # 6. 安装 Bun
            curl -L https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o bun.zip
            unzip -o bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/bun
            chmod +x /usr/local/bin/bun

            # 7. 安装依赖
            bun install --force

            # 8. 编译
            bun build ./packages/opencode/src/cli.ts \
              --compile \
              --minify \
              --target=linux-x64 \
              --outfile /workspace/opencode-centos7-static

            # 9. 验证
            ls -lh /workspace
            file /workspace/opencode-centos7-static
          '

      - name: Show binary
        run: |
          ls -lh opencode-centos7-static
          file opencode-centos7-static
