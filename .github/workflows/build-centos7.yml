name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS7 container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace centos:7 bash -c '
            set -e
            
            echo "=== Fixing CentOS7 YUM repo ==="
            sed -i "s|mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            
            echo "=== Installing build dependencies ==="
            yum install -y git curl tar gzip zip unzip gcc gcc-c++ make python3 python3-devel
            yum install -y glibc-static libstdc++-static
            
            echo "=== Downloading Bun (baseline for CentOS7) ==="
            curl -L https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-baseline.zip -o bun.zip
            unzip bun.zip
            mv bun-linux-x64-baseline/bun /usr/local/bin/bun
            chmod +x /usr/local/bin/bun
            echo "Bun version:"
            /usr/local/bin/bun --version
            
            echo "=== Installing project dependencies ==="
            /usr/local/bin/bun install
            
            echo "=== Building statically for CentOS7 ==="
            /usr/local/bin/bun build ./packages/opencode/src/cli.ts \
              --compile \
              --minify \
              --target=linux-x64 \
              --outfile opencode-centos7-static
            
            echo "=== Verifying static linking ==="
            file opencode-centos7-static
            echo "=== Binary Info ==="
            ls -lh opencode-centos7-static
            echo "=== Checking dependencies ==="
            ldd opencode-centos7-static || echo "Binary is statically linked (no ldd output)"
          '

      - name: Verify binary is fully static
        run: |
          file opencode-centos7-static
          # Try to run ldd - should show "not a dynamic executable" for static binaries
          output=$(ldd opencode-centos7-static 2>&1 || true)
          if echo "$output" | grep -q "not a dynamic executable"; then
            echo "✓ Binary is fully statically linked"
          elif echo "$output" | grep -q "statically linked"; then
            echo "✓ Binary is fully statically linked"
          else
            echo "ℹ Binary check output: $output"
          fi
          
          ls -lh opencode-centos7-static

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencode-centos7-static
          path: opencode-centos7-static
