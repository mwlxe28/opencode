name: Build OpenCode for CentOS7 (Statically Compiled)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: centos:7

    steps:
      - name: Fix CentOS7 YUM repo (vault.centos.org)
        run: |
          sed -i 's|mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-Base.repo
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-Base.repo

      - name: Install dependencies
        run: yum install -y git curl tar gzip zip unzip gcc glibc-static

      - name: Download Bun (baseline for CentOS7)
        run: |
          curl -L https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-baseline.zip -o bun.zip
          unzip bun.zip
          mv bun-linux-x64-baseline/bun /usr/local/bin/bun
          chmod +x /usr/local/bin/bun
          bun --version

      - uses: actions/checkout@v4

      - name: Install deps
        run: bun install

      - name: Build statically for CentOS7
        run: |
          bun build ./packages/opencode/src/cli.ts \
            --compile \
            --minify \
            --target=linux-x64 \
            --outfile opencode-centos7-static
        env:
          # 强制静态链接
          CFLAGS: "-static"
          LDFLAGS: "-static"

      - name: Verify static linking
        run: |
          file opencode-centos7-static
          ldd opencode-centos7-static || echo "Binary is statically linked"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencode-centos7-static
          path: opencode-centos7-static
